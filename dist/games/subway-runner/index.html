<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>Subway Runner — StreamVibe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#231F20; }

  /* Gift flash — must be above Unity canvas which is z-index ~1 */
  #sv-flash {
    position:fixed; top:50px; left:50%; transform:translateX(-50%);
    z-index:99999; pointer-events:none;
    font-size:26px; font-weight:bold; font-family:Arial,sans-serif;
    letter-spacing:2px; white-space:nowrap; opacity:0;
    background:rgba(0,0,0,0.75); padding:10px 22px; border-radius:30px;
    border:2px solid currentColor;
  }
  #sv-flash.show { animation:svFade 2.4s forwards; }
  @keyframes svFade {
    0%   { opacity:0; transform:translateX(-50%) translateY(10px) scale(0.9); }
    12%  { opacity:1; transform:translateX(-50%) translateY(0)    scale(1);   }
    75%  { opacity:1; }
    100% { opacity:0; transform:translateX(-50%) translateY(-20px) scale(0.95); }
  }
</style>
</head>
<body>

<div id="sv-flash"></div>

<script>
(function() {
  var noop = function() {};
  var resolved = function() { return Promise.resolve(); };

  // ── Proxy window.PokiSDK so every assignment gets our auto-resolve stubs ──
  var _poki = {};
  function patchSdk(sdk) {
    if (!sdk) return;
    sdk.init                = resolved;
    sdk.gameInteractive     = resolved;  // ← must resolve or game stays gray
    sdk.commercialBreak     = resolved;
    sdk.rewardedBreak       = resolved;
    sdk.gameLoadingFinished = noop;
    sdk.gameLoadingStart    = noop;
    sdk.gameplayStart       = noop;
    sdk.gameplayStop        = noop;
    sdk.roundStart          = noop;
    sdk.roundEnd            = noop;
    sdk.happyTime           = noop;
    sdk.customEvent         = noop;
    sdk.disableProgrammatic = noop;
    sdk.muteAd              = noop;
    sdk.destroyAd           = noop;
    sdk.setDebug            = noop;
    sdk.logError            = noop;
    sdk.sendHighscore       = noop;
    sdk.gameLoadingProgress = noop;
    sdk.toggleNonPersonalized = noop;
    sdk.setConsentString    = noop;
    sdk.setPlayerAge        = function(age) {
      // Auto-confirm adult age so the in-game age gate is skipped
      if (window._pokiBridge && window._pokiBridge.setPlayerAge) {
        try { window._pokiBridge.setPlayerAge(25); } catch(e){}
      }
    };
    sdk.shareableURL        = function(url) { return url || window.location.href; };
    sdk.getLeaderboard      = function() { return Promise.resolve({}); };
  }

  Object.defineProperty(window, 'PokiSDK', {
    get: function() { return _poki; },
    set: function(val) { _poki = val || {}; patchSdk(_poki); },
    configurable: true
  });

  // ── initPokiBridge called synchronously by Unity WASM on startup ──────────
  window.initPokiBridge = function(bridge) {
    try {
      if (!bridge) return;
      window._pokiBridge = bridge;

      var autoResolve = ['gameInteractive','commercialBreak','rewardedBreak'];
      var noops = ['gameLoadingStart','gameLoadingFinished','gameplayStart',
                   'gameplayStop','roundStart','roundEnd','happyTime',
                   'customEvent','shareableURL','setDebug','logError',
                   'sendHighscore','gameLoadingProgress','setPlayerAge',
                   'disableProgrammatic','muteAd','destroyAd','getLeaderboard'];

      autoResolve.forEach(function(m) { bridge[m] = resolved; });
      noops.forEach(function(m) { if (!bridge[m]) bridge[m] = noop; });

      // ── AUTO-BYPASS AGE GATE ─────────────────────────────────────────────
      // Unity calls bridge.setPlayerAge() when it wants the age gate.
      // We intercept it and immediately call back with age=25 so the game
      // skips the gate entirely.
      bridge.setPlayerAge = function(callback) {
        try {
          // callback may be a function Unity passes for us to call with the age
          if (typeof callback === 'function') {
            setTimeout(function() { callback(25); }, 0);
          }
          // Also call the SDK method directly
          if (window.PokiSDK && window.PokiSDK.setPlayerAge) {
            window.PokiSDK.setPlayerAge(25);
          }
        } catch(e) {}
      };

    } catch(e) {}
  };

  window.showUnitywebNoSupport = function() {};
})();

// ── window.config ──────────────────────────────────────────────────────────
window.config = {
  loader:             'unity',
  debug:              false,
  maxRatio:           16 / 9,
  minRatio:           9 / 16,
  title:              'Subway Surfers: San Francisco',
  unityVersion:       '2019.4.18f1',
  unityWebglBuildUrl: 'Build/SanFrancisco/SanFrancisco.json',
  fileSize:           35,
  cachedDecompressedFileSizes: {
    'SanFrancisco.asm.code.unityweb':       9077143,
    'SanFrancisco.asm.framework.unityweb':  86369,
    'SanFrancisco.asm.memory.unityweb':     951447,
    'SanFrancisco.data.unityweb':           18323917,
    'SanFrancisco.wasm.code.unityweb':      7279617,
    'SanFrancisco.wasm.framework.unityweb': 90693,
  },
};
</script>

<script type="text/javascript" src="4399.z.js"></script>

<!-- StreamVibe TikTok gift bridge -->
<script>
(function() {
  var EVT = {
    spawn_coins: { label:'🪙  COINS INCOMING!',  color:'#ffd700' },
    jetpack:     { label:'🚀  JETPACK!',          color:'#ff9f43' },
    magnet:      { label:'🧲  COIN MAGNET!',      color:'#74b9ff' },
    sneakers:    { label:'👟  SUPER SNEAKERS!',   color:'#55efc4' },
    hoverboard:  { label:'🛹  HOVERBOARD!',       color:'#fd79a8' },
    x2_score:    { label:'✕2  DOUBLE SCORE!',     color:'#a29bfe' },
    add_life:    { label:'♥  +1 LIFE!',           color:'#fd79a8' },
    clear_track: { label:'💥  TRACK CLEARED!',    color:'#fdcb6e' },
  };

  var flashTimer = null;
  function flash(label, color) {
    var el = document.getElementById('sv-flash');
    if (!el) return;
    el.textContent = label;
    el.style.color = color;
    el.style.borderColor = color;
    el.style.boxShadow = '0 0 30px ' + color + '88';
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function() { el.classList.remove('show'); }, 2400);
  }

  // Listen for postMessage from the React dashboard
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'sv_gift') return;
    var evt = e.data.event;
    var meta = EVT[evt];
    if (meta) flash(meta.label, meta.color);
    triggerGameEvent(evt);
  });

  // Also expose directly
  window.svGift = function(event) {
    var meta = EVT[event];
    if (meta) flash(meta.label, meta.color);
    triggerGameEvent(event);
  };

  // ── Map gift events to real Unity SendMessage calls ──────────────────────
  // Discovered by decompiling SanFrancisco.data.unityweb:
  //   PickupType enum: Jetpack, CoinMagnet, SuperSneakers, Hoverboard, Multiplier, ScoreBooster
  //   Key methods: ForceSpawnPickupType, SetForceSpawnPickupTypeAndOriginalTo
  //   FakeTouch system: UseFakeInput, ProcessFakeTouches, FakeTouches
  //   GameObject: PickupManager, ingameTouchDetection

  function sendMsg(obj, method, param) {
    try {
      var mod = window.Module || (window.unityInstance && window.unityInstance.Module);
      if (mod && mod.SendMessage) {
        if (param !== undefined) mod.SendMessage(obj, method, param);
        else mod.SendMessage(obj, method);
        return true;
      }
    } catch(e) {}
    return false;
  }

  // Force-spawn a powerup by telling PickupManager to spawn it next
  function spawnPickup(type) {
    // Try multiple known object names - Unity scene object name may vary
    var objects = ['PickupManager', 'PickupManagerController', 'GameManager', 'InGame'];
    for (var i = 0; i < objects.length; i++) {
      if (sendMsg(objects[i], 'ForceSpawnPickupType', type)) break;
      sendMsg(objects[i], 'SetForceSpawnPickupTypeAndOriginalTo', type);
    }
  }

  // Fake swipe using ingameTouchDetection
  function fakeSwipe(dx, dy) {
    var canvas = document.querySelector('#game canvas') || document.querySelector('canvas');
    if (!canvas) return;
    var rect = canvas.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height * 0.6;
    function makeTouch(x, y) {
      return new Touch({ identifier: Date.now(), target: canvas, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y, radiusX: 10, radiusY: 10, rotationAngle: 0, force: 1 });
    }
    var t1 = makeTouch(cx, cy);
    var t2 = makeTouch(cx + dx, cy + dy);
    canvas.dispatchEvent(new TouchEvent('touchstart', { bubbles: true, cancelable: true, touches: [t1], targetTouches: [t1], changedTouches: [t1] }));
    setTimeout(function() {
      canvas.dispatchEvent(new TouchEvent('touchend', { bubbles: true, cancelable: true, touches: [], targetTouches: [], changedTouches: [t2] }));
    }, 80);
  }

  function triggerGameEvent(event) {
    switch(event) {
      case 'jetpack':
        // Spawn the Jetpack pickup on the track
        spawnPickup('Jetpack');
        spawnPickup('3'); // numeric fallback (Jetpack=2 or 3 in enum)
        break;
      case 'magnet':
        spawnPickup('CoinMagnet');
        spawnPickup('1');
        break;
      case 'sneakers':
        spawnPickup('SuperSneakers');
        spawnPickup('4');
        break;
      case 'hoverboard':
        spawnPickup('Hoverboard');
        spawnPickup('0');
        // Also try activating directly
        sendMsg('PickupManager', 'ActivatePickup', 'Hoverboard');
        break;
      case 'x2_score':
        spawnPickup('Multiplier');
        spawnPickup('2');
        break;
      case 'spawn_coins':
        // SpawnCoinRow on PickupManager
        sendMsg('PickupManager', 'SpawnCoinRows', '3');
        sendMsg('PickupManager', 'SpawnCoins', '20');
        sendMsg('InGame', 'SpawnCoins', '20');
        break;
      case 'add_life':
        // No direct life add - do a hoverboard as shield equivalent
        spawnPickup('Hoverboard');
        break;
      case 'clear_track':
        // Rapid lane dodges via fakeSwipe
        fakeSwipe(-150, 0);
        setTimeout(function() { fakeSwipe(150, 0); }, 200);
        setTimeout(function() { fakeSwipe(-150, 0); }, 400);
        // Also try clearing obstacles via SendMessage
        sendMsg('InGame', 'ClearObstacles', '');
        sendMsg('GameManager', 'ClearObstacles', '');
        break;
    }
  }
})();
</script>
