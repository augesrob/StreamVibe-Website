<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Runner — StreamVibe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#231F20; }
  #sv-flash {
    position:fixed; top:60px; left:50%; transform:translateX(-50%);
    z-index:9999; pointer-events:none;
    font-size:22px; font-weight:bold; font-family:monospace; letter-spacing:2px;
    white-space:nowrap; opacity:0;
  }
  #sv-flash.show { animation:svFade 2.4s forwards; }
  @keyframes svFade {
    0%   { opacity:0; transform:translateX(-50%) translateY(8px); }
    12%  { opacity:1; transform:translateX(-50%) translateY(0); }
    75%  { opacity:1; }
    100% { opacity:0; transform:translateX(-50%) translateY(-18px); }
  }
</style>
</head>
<body>
<div id="sv-flash"></div>
<script>
// ── 1. Patch PokiSDK so gameInteractive always resolves immediately ──────
// We use a Proxy on window so every time anything sets window.PokiSDK
// (poki-sdk.js sets it, then poki-sdk-core sets it again) we immediately
// wrap gameInteractive / commercialBreak / rewardedBreak to auto-resolve.
(function() {
  var noop = function() {};
  var resolved = function() { return Promise.resolve(); };

  function patch(sdk) {
    if (!sdk) return;
    // These must auto-resolve or the game stays gray
    sdk.gameInteractive   = resolved;
    sdk.commercialBreak   = resolved;
    sdk.rewardedBreak     = resolved;
    sdk.init              = resolved;
    // These just need to exist
    ['gameLoadingStart','gameLoadingFinished','gameplayStart','gameplayStop',
     'roundStart','roundEnd','happyTime','customEvent','disableProgrammatic',
     'muteAd','destroyAd','setDebug','logError','sendHighscore',
     'gameLoadingProgress','setPlayerAge','shareableURL'].forEach(function(m) {
      if (typeof sdk[m] !== 'function') sdk[m] = noop;
    });
  }

  // Intercept every assignment to window.PokiSDK
  var _poki = {};
  Object.defineProperty(window, 'PokiSDK', {
    get: function() { return _poki; },
    set: function(val) {
      _poki = val || {};
      patch(_poki);
    },
    configurable: true
  });

  // Also intercept initPokiBridge called by Unity WASM
  window.initPokiBridge = function(bridge) {
    try {
      if (bridge) {
        ['gameLoadingStart','gameLoadingFinished','gameInteractive',
         'gameplayStart','gameplayStop','roundStart','roundEnd',
         'rewardedBreak','commercialBreak','happyTime','customEvent',
         'shareableURL','setDebug','logError','sendHighscore',
         'gameLoadingProgress','setPlayerAge','disableProgrammatic',
         'muteAd','destroyAd','getLeaderboard'].forEach(function(m) {
          bridge[m] = /Break|Interactive|init/.test(m) ? resolved : noop;
        });
      }
      window._pokiBridge = bridge;
    } catch(e) {}
  };

  window.showUnitywebNoSupport = function() {};
})();

// ── 2. window.config ────────────────────────────────────────────────────
window.config = {
  loader:             'unity',
  debug:              false,
  maxRatio:           16 / 9,
  minRatio:           9 / 16,
  title:              'Subway Surfers: San Francisco',
  unityVersion:       '2019.4.18f1',
  unityWebglBuildUrl: 'Build/SanFrancisco/SanFrancisco.json',
  fileSize:           35,
  cachedDecompressedFileSizes: {
    'SanFrancisco.asm.code.unityweb':       9077143,
    'SanFrancisco.asm.framework.unityweb':  86369,
    'SanFrancisco.asm.memory.unityweb':     951447,
    'SanFrancisco.data.unityweb':           18323917,
    'SanFrancisco.wasm.code.unityweb':      7279617,
    'SanFrancisco.wasm.framework.unityweb': 90693,
  },
};
</script>

<script type="text/javascript" src="4399.z.js"></script>

<!-- 4. StreamVibe TikTok gift bridge -->
<script>
(function() {
  var EVT = {
    spawn_coins: { label:'Coins! 🪙',      color:'#ffd700' },
    jetpack:     { label:'JETPACK! 🚀',    color:'#ff9f43' },
    magnet:      { label:'Magnet! 🧲',     color:'#74b9ff' },
    sneakers:    { label:'Sneakers! 👟',   color:'#55efc4' },
    hoverboard:  { label:'Hoverboard! 🛹', color:'#fd79a8' },
    x2_score:    { label:'×2 Score! ✕2',  color:'#a29bfe' },
    add_life:    { label:'+1 Life! ♥',    color:'#fd79a8' },
    clear_track: { label:'Track Cleared!', color:'#fdcb6e' },
  };
  var flashTimer = null;
  function flash(label, color) {
    var el = document.getElementById('sv-flash');
    if (!el) return;
    el.textContent = label; el.style.color = color;
    el.style.textShadow = '0 0 22px ' + color;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'sv_gift') return;
    var meta = EVT[e.data.event];
    if (meta) flash(meta.label, meta.color);
    if (window.unityInstance) {
      try { window.unityInstance.SendMessage('GameManager','OnTikTokGift', e.data.event); } catch(_) {}
    }
  });
})();
</script>

</body>
</html>
