<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Runner - StreamVibe</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#231F20; }
#sv-flash {
  position:fixed; top:50px; left:50%; transform:translateX(-50%);
  z-index:99999; pointer-events:none;
  font-size:26px; font-weight:bold; font-family:Arial,sans-serif;
  letter-spacing:2px; white-space:nowrap; opacity:0;
  background:rgba(0,0,0,0.75); padding:10px 22px; border-radius:30px;
  border:2px solid currentColor;
}
#sv-flash.show { animation:svFade 2.4s forwards; }
@keyframes svFade {
  0%   { opacity:0; transform:translateX(-50%) translateY(10px) scale(0.9); }
  12%  { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  75%  { opacity:1; }
  100% { opacity:0; transform:translateX(-50%) translateY(-20px) scale(0.95); }
}
</style>
</head>
<body>
<div id="sv-flash"></div>
<script>
(function() {
  var noop = function() {};
  var resolved = function() { return Promise.resolve(); };
  window.PokiSDK = {
    init:resolved, gameInteractive:resolved, commercialBreak:resolved, rewardedBreak:resolved,
    gameLoadingStart:noop, gameLoadingFinished:noop, gameplayStart:noop, gameplayStop:noop,
    roundStart:noop, roundEnd:noop, happyTime:noop, customEvent:noop,
    disableProgrammatic:noop, muteAd:noop, destroyAd:noop, setDebug:noop,
    logError:noop, sendHighscore:noop, gameLoadingProgress:noop,
    toggleNonPersonalized:noop, setConsentString:noop, setPlayerAge:noop,
    shareableURL:function(u){return u||location.href;},
    getLeaderboard:function(){return Promise.resolve({});}
  };
  var _orig = document.createElement.bind(document);
  document.createElement = function(tag) {
    var el = _orig(tag);
    if (tag.toLowerCase()==='script') {
      el.addEventListener('load', function() {
        if (el.src && el.src.indexOf('poki-sdk-core')>-1) {
          setTimeout(function() {
            if (window.PokiSDK) {
              window.PokiSDK.gameInteractive=resolved;
              window.PokiSDK.commercialBreak=resolved;
              window.PokiSDK.rewardedBreak=resolved;
              window.PokiSDK.init=resolved;
            }
          }, 0);
        }
      });
    }
    return el;
  };
  window.initPokiBridge = function(bridge) {
    try {
      if (!bridge) return;
      window._pokiBridge = bridge;
      bridge.gameInteractive=resolved; bridge.commercialBreak=resolved;
      bridge.rewardedBreak=resolved; bridge.setPlayerAge=noop;
    } catch(e) {}
  };
  window.showUnitywebNoSupport = function() {};
  window.commercialBreak = function(cb){if(cb)cb();};
  window.rewardedBreak = function(cb){if(cb)cb();};
})();
window.config = {
  loader:'unity', debug:false, maxRatio:16/9, minRatio:9/16,
  title:'Subway Surfers: San Francisco', unityVersion:'2019.4.18f1',
  unityWebglBuildUrl:'Build/SanFrancisco/SanFrancisco.json', fileSize:35,
  cachedDecompressedFileSizes:{
    'SanFrancisco.asm.code.unityweb':9077143,'SanFrancisco.asm.framework.unityweb':86369,
    'SanFrancisco.asm.memory.unityweb':951447,'SanFrancisco.data.unityweb':18323917,
    'SanFrancisco.wasm.code.unityweb':7279617,'SanFrancisco.wasm.framework.sv1.unityweb':90693,
  },
};
</script>
<script src="4399.z.js"></script>
<script src="master-loader.js"></script>
<script>
(function() {
  var EVT = {
    spawn_coins:{label:'Coins! ',color:'#ffd700'},
    jetpack:{label:'JETPACK! ',color:'#ff9f43'},
    magnet:{label:'Coin Magnet! ',color:'#74b9ff'},
    sneakers:{label:'Super Sneakers! ',color:'#55efc4'},
    hoverboard:{label:'Hoverboard! ',color:'#fd79a8'},
    x2_score:{label:'x2 Score! ',color:'#a29bfe'},
    add_life:{label:'+1 Life! ',color:'#fd79a8'},
    clear_track:{label:'Track Cleared! ',color:'#fdcb6e'},
  };
  var PICKUP = {
    jetpack:'Jetpack', magnet:'CoinMagnet', sneakers:'SuperSneakers',
    hoverboard:'Hoverboard', x2_score:'Multiplier', add_life:'Hoverboard',
  };
  var flashTimer=null;
  function flash(label,color) {
    var el=document.getElementById('sv-flash');
    if(!el)return;
    el.textContent=label; el.style.color=color;
    el.style.borderColor=color; el.style.boxShadow='0 0 30px '+color+'88';
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    if(flashTimer)clearTimeout(flashTimer);
    flashTimer=setTimeout(function(){el.classList.remove('show');},2400);
  }
  function triggerGameEvent(event) {
    if(event==='spawn_coins'){if(window.svCoins)window.svCoins(20);}
    else if(PICKUP[event]){if(window.svPowerup)window.svPowerup(PICKUP[event]);}
    window.parent.postMessage({type:'sv_triggered',event:event,svReady:!!window.svReady},'*');
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='sv_gift')return;
    var meta=EVT[e.data.event];
    if(meta)flash(meta.label,meta.color);
    triggerGameEvent(e.data.event);
  });
  window.svGift=function(event){
    var meta=EVT[event];
    if(meta)flash(meta.label,meta.color);
    triggerGameEvent(event);
  };
})();
</script>
</body>
</html>
